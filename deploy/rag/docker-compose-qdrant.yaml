name: ai-chat-rag

services:
  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: ai-chat-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
    name: ai-chat-qdrant-data
