# RAG V2 离线索引和在线检索共用的非敏感配置。
# 修改 `collection_prefix` 或 `bm25.tokenizer_version` 后需重新构建索引；
# 仅调整候选数、RRF 或 MMR 参数时，重启 RAG 服务即可。
collection_prefix: tech_docs_v2

bm25:
  candidate_top_k: 15
  tokenizer_version: jieba-identifier-v1

rrf:
  rank_constant: 20
  dense_weight: 1.0
  bm25_weight: 0.005

mmr:
  lambda: 0.7

# OPERA-style Multi-Agent Multi-hop RAG 的非敏感运行合同。
# 本节在 OPERA 服务实现后才生效，不影响现有 RAG V2 的离线索引、/search 或旧 Chat。
# 密钥只通过 .env 注入；不要把 API key、Langfuse secret 或用户内容写入本文件。
opera:
  # 单次请求的最大计划步骤数，以及单个子目标允许的最大查询改写次数。
  max_steps: 4
  max_rewrites: 2

  # 默认每题只在 HotpotQA 自身的候选 paragraph 中检索；all 预留给全库检索评测。
  retrieval:
    # OPERA 独立 collection 的前缀；与 RAG V2 的 tech_docs_v2 互不混用。
    collection_prefix: hotpot_distractor_v1
    default_scope: case
    top_k: 3
    # case 范围仅有 10 个 paragraph；按需构建的 BM25 模型缓存上限。
    case_bm25_cache_size: 256

  # DeepSeek /models 已验证可用的 Responses API 模型；Langfuse 使用同名精确匹配的价格定义。
  model:
    provider: deepseek
    name: deepseek-v4-flash
    # Responses API 的思考强度：none、low、high、max。低强度为多跳推理保留预算，
    # 同时避免 reasoning 挤占 JSON Schema 最终输出。
    reasoning_effort: low

  # 每个 Agent 的输出上限。该值作为模型请求参数传入，是成本控制的软限制。
  # Agent 返回仍必须同时满足 JSON Schema 和本地 Pydantic 校验。
  agents:
    planner:
      max_output_tokens: 2000
      timeout_seconds: 20
    analysis_answer:
      max_output_tokens: 2000
      timeout_seconds: 20
    rewriter:
      max_output_tokens: 3000
      timeout_seconds: 20

  schema_validation:
    # 模型返回不符合 Schema 或 Pydantic 校验时，最多使用修复指令重试一次。
    max_repair_attempts: 1

  # Langfuse 用于 prompt 版本与成本观测。远端不可用时使用本地 prompts/ 兜底。
  # enabled 为 false 时不建立 Langfuse 连接，仍可使用本地 prompt 正常执行。
  langfuse:
    enabled: true
    prompt_label: production
    prompt_cache_ttl_seconds: 300
    # 默认不上传问题、query、paragraph 与 Agent 输出；仅本地排障时可临时改为 true。
    capture_input_output: false
    # 三份纯文本 system prompt 在 Langfuse 中的固定名称；通过 python -m opera.prompt_sync 首次同步。
    prompts:
      planner: opera-planner-system
      analysis_answer: opera-analysis-answer-system
      rewriter: opera-rewrite-system

  # 每个请求写一份本地链路调试轨迹；目录必须在项目根目录 out/ 下，且 out/ 已被 Git 忽略。
  debug_trace:
    enabled: true
    output_directory: out/opera-traces
